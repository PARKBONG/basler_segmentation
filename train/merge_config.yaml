# 2단계 파인튜닝 데이터셋 설정 — download.py 와 merge.py 가 이 파일 하나를 공유.
#   download.py : roboflow: 블록이 있는 소스를 SDK로 다운로드
#   merge.py    : role 별로 stage1(공개) / stage2(in-domain) 데이터셋 2벌 생성
# 경로는 이 yaml(=train/ 폴더) 기준 상대경로 또는 절대경로.

# 최종 통합 클래스 — index가 최종 class id. class_map의 목적지 이름은 반드시 여기 존재해야 함.
names:
  0: wire

seed: 0

# 병합 결과 출력 위치 (train.py 가 읽는 곳)
out:
  stage1: ../datasets/stage1     # 공개 warm-up 전용
  stage2: ../datasets/stage2     # in-domain 적응 + 검증 + 테스트

# Stage1(공개) 내부 train/val 분할 — 학습 메커니즘/모니터링용.
#   ★ in-domain 은 stage1 에 전혀 포함하지 않음 → in-domain val/test 완전 격리(데이터 위생).
public_val_ratio: 0.1

# Stage2(in-domain) 3분할 — 데이터 위생의 핵심.
#   ★ 실험(exp) 단위 그룹 분할: images/<실험>/ 폴더를 통째로 배정 → 영상 프레임 누수 차단.
#   ratio 는 이미지 수 기준 목표(실험 통째 배정이라 근사값).
local_split:
  val_ratio: 0.2     # best.pt 선택용 (in-domain val)
  test_ratio: 0.1    # 최종 1회 평가용 (학습/선택에 절대 사용 금지)
  # ↓ 수동 선별: 특정 실험을 직접 test/val 로 고정 지정. 지정 시 자동분할보다 우선.
  #   ★ 파일명이 아니라 "실험명(폴더명)" 목록 (한 줄에 하나). 예 파일 내용:  exp003
  #   목록 텍스트 경로. 예: ../datasets/mine/splits/test.txt
  #   지금은 null → 자동 분할(ratio + seed). 나중에 목록만 채우면 그게 우선됨.
  val_list: null
  test_list: null

sources:
  # ── 로컬 in-domain (비공개, 인도메인 = 귀중) → Stage2 ─────────────────
  #   datasets/mine/ 에 YOLO seg 데이터 배치 + data.yaml 하나 작성:
  #     names: {0: wire}
  #     train: images/train      # (실제 이미지 폴더 위치. val 은 없어도 됨)
  - name: my_local
    role: local                # → stage2 (3분할 대상)
    path: ../datasets/mine
    class_map:                 # 소스클래스명 → 최종클래스명 (여기 없는 소스 클래스는 제외)
      wire: wire

  # ── 공개 데이터셋 (Roboflow, 보조) → Stage1. 필요한 만큼 블록 복제해서 추가 ──
  - name: roboflow_a
    role: public               # → stage1 (warm-up 전용)
    path: ../datasets/rf_a
    class_map:
      cable: wire              # 예: 공개셋의 'cable' 을 최종 'wire' 로 통일
    roboflow:                  # 이 블록이 있으면 download.py 가 SDK로 받아옴
      workspace: ""           # Universe 페이지의 "Download Dataset" 코드 스니펫에서 확인
      project: ""
      version: 1
      format: yolov11         # 세그멘테이션 export 포맷 (yolov8/yolov11 등)
