# Stage 1 (공개 warm-up) 데이터셋 구성 — preprocess.py 전용.
#   python preprocess.py --config preprocess_config.stage1.yaml
# 산출물 datasets/stage1/data.yaml 은 train_config.stage1.yaml 의 train.data 가 읽습니다.
#
# 공개 데이터만 포함 (in-domain 미포함 — 격리 유지가 이 스테이지의 존재 이유입니다).
# stage1 의 선택 지표(val)는 공개셋에서 뗍니다. Roboflow 증강 사본(..._jpg.rf.<hash>)은
# 원본 단위로 묶어 나누므로 근중복이 train/val 에 갈라 들어가는 누수는 없습니다.
# 최종 test 는 in-domain 이므로 여기서는 만들지 않습니다 (test_ratio: 0.0).

# 최종 통합 클래스 — index가 최종 class id. class_map의 목적지 이름은 반드시 여기 존재해야 함.
names:
  0: wire

# 비움 = sources 전체 처리. 일부만 다시 구울 때 이름을 적으세요.
targets: []

sources:
  # 공개셋 블록은 필요한 만큼 복제해서 rf_b, rf_c … 로 추가 (download_config.yaml 과 같은 path).
  - name: rf_a
    path: ../datasets/raw/rf_a
    class_map:
      wire: wire
    val_ratio: 0.1             # stage1 선택 지표용 공개 val (그룹 분할 → 근중복 누수 없음)
    test_ratio: 0.0            # 최종 test 는 in-domain(stage2)에서만
    oversample: 1
    crop:
      enabled: false           # 공개셋은 이미 잘려 있음
    resize: null

out: ../datasets/stage1        # 소스별로 out/<이름>/, out/data.yaml 이 전체를 묶습니다
seed: 0

preview:
  enabled: true
  count: 12
