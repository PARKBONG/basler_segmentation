# 데이터셋 구성 설정 — preprocess.py 전용.
# (명령행 인자 없음. 값은 전부 여기서 수정)
# 경로는 이 yaml(=finetuner/ 폴더) 기준 상대경로 또는 절대경로.
#
# 공개셋을 어디서 받을지는 download_config.yaml 이 소유합니다. 여기서는 이미 디스크에
# 있는 폴더를 "어떻게 학습셋으로 만들지"만 정합니다.
#
# 소스마다 인자가 따로 붙습니다. raw(내 카메라 원본)는 풀사이즈라 크롭이 필요하고,
# 공개셋은 이미 작게 잘려 있어 크롭이 필요 없는 식으로 각각 다르게 처리됩니다.

# 최종 통합 클래스 — index가 최종 class id. class_map의 목적지 이름은 반드시 여기 존재해야 함.
names:
  0: wire

# 모든 소스에 공통 적용되는 기본값. 소스별 crop 블록이 이 위에 덮어씁니다.
defaults:
  crop:
    enabled: false

sources:
  # ── 내 카메라 원본 (비공개, 인도메인 = 귀중) ─────────────────────────
  #   앱(BaslerLiveView)의 REC 가 크롭 전 풀사이즈 PNG 를 images/train 에 쌓습니다.
  #   라벨링 결과를 labels/train 에 넣고 data.yaml 을 한 줄짜리로 만들어 두세요:
  #       names: {0: wire}
  #       train: images/train
  - name: raw
    path: ../datasets/raw
    class_map:                 # 소스클래스명 → 최종클래스명 (여기 없는 소스 클래스는 제외)
      wire: wire
    val_ratio: 0.2             # 20% 를 in-domain 검증셋(val)으로 → 검증은 내 데이터에서만
    oversample: 1              # train 강조 배수 (추후 상향 가능)
    crop:
      # 이미지와 폴리곤 라벨을 함께 자릅니다. 위치 규약은 앱 FrameCropper 와 동일:
      #   center_x/center_y = 0% 왼쪽/위 끝, 100% 오른쪽/아래 끝, 50% 중앙.
      #   → 앱 툴바 슬라이더에서 찾은 값을 그대로 옮겨 적으면 됩니다.
      # 원본보다 큰 크기를 적으면 원본 크기로 클램프됩니다.
      enabled: true
      width: 640
      height: 640
      center_x: 50
      center_y: 50
      # 크롭 후 남은 폴리곤 면적 / 원래 면적. 이 값 미만이면 그 인스턴스는 폐기합니다
      # (경계에 걸린 부스러기 라벨 제거). 살아남은 인스턴스가 0이면 이미지째 제외.
      min_area: 0.10
    # 크롭 후 리사이즈. null 이면 그대로. 라벨은 정규화 좌표라 영향 없음.
    # 학습은 어차피 imgsz 로 letterbox 하므로 보통 null 로 둬도 됩니다.
    resize: null

  # ── 공개 데이터셋 (보조) — download_config.yaml 의 path 와 같은 값을 쓸 것 ──
  #   필요한 만큼 블록을 복제해서 rf_b, rf_c … 로 추가. 각자 다른 인자를 가집니다.
  - name: rf_a
    path: ../datasets/rf_a
    class_map:
      cable: wire              # 예: 공개셋의 'cable' 을 최종 'wire' 로 통일
    val_ratio: 0.0             # 공개셋은 val 에 넣지 않음 (검증 오염 방지 → train 전용)
    oversample: 1
    crop:
      enabled: false           # 이미 잘려 있으면 그대로. 필요하면 소스별로 켜면 됩니다.
    resize: null

out: ../datasets/processed     # 산출물 = 학습(train.py)이 읽는 위치
seed: 0

# 산출물에서 몇 장을 골라 라벨 폴리곤을 그려 out/_preview/ 에 저장합니다.
# 크롭이 라벨을 제대로 따라 잘랐는지 눈으로 확인하는 용도.
preview:
  enabled: true
  count: 12
