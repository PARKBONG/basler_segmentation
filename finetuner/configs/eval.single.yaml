# 단일 스테이지(baseline) 평가 — in-domain val.
#   python eval.py --config eval.single.yaml
# weights 는 train.single.yaml 의 train.project/name 산출물과 짝.

# weights: 타임스탬프를 뺀 경로면 그 name 의 가장 최근 실행
#   (runs/obb/<name>/<YYMMDD_HHMMSS>/weights/best.pt)을 씁니다. 고정하려면 타임스탬프까지 적으세요.
weights: runs/obb/yolo26s-obb-finetune/weights/best.pt
data: ../datasets/processed/data.yaml
split: val
imgsz: 640
device: "0"

# 추론 결과를 이미지에 그려 저장 (초록 = 원본 라벨, 빨강 = 추론).
#   finetuner/eval/<YYMMDD_HHMMSS>__<가중치>__<데이터셋>-<split>/  (summary.txt 에 출처)
visualize:
  enabled: true
  count: 20        # 균등 간격으로 뽑을 장수. 0 이면 split 전체
  conf: 0.25       # 이 점수 미만 예측은 그리지 않음
  out: eval        # finetuner/ 기준
