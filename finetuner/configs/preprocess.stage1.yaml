# Stage 1 (공개 warm-up) — 공개 데이터만, in-domain 미포함 (격리 유지가 존재 이유).
#   python preprocess.py --config preprocess.stage1.yaml
# Roboflow 증강 사본(..._jpg.rf.<hash>)은 원본 단위로 묶어 나누므로 누수 없음.
# 필드 설명은 preprocess.single.yaml 머리말 참고.

pipeline: pipeline.yaml

out: ../datasets/stage1      # train.stage1.yaml 이 읽음
use:
  rf_a: {val_ratio: 0.1}     # stage1 선택 지표용 공개 val

# only: [rf_a]
