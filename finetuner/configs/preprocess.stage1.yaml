# Stage 1 (공개 warm-up) — 공개 데이터만, in-domain 미포함 (격리 유지가 존재 이유).
#   python preprocess.py --config preprocess.stage1.yaml
# Roboflow 증강 사본(..._jpg.rf.<hash>)은 원본 단위로 묶어 나누므로 누수 없음.
# 필드 설명은 preprocess.single.yaml 머리말 참고. 이 파일이 이 스테이지의
# 전처리 전부를 소유합니다 — 다른 yaml 을 참조하지 않습니다.

names:
  0: wire

seed: 0

preview:
  enabled: true
  count: 12

# 산출 라벨 형식. obb = seg 폴리곤을 회전 사각형(꼭지점 4개)으로 변환해 저장
# (이 프로젝트는 OBB 로 진행). seg = 폴리곤 그대로.
task: obb

out: ../datasets/stage1      # train.stage1.yaml 의 train.data 와 1:1 짝

sources:
  - name: rf_a
    path: ../datasets/raw/rf_a   # download.py(configs/download.yaml)로 먼저 받아두세요
    class_map:
      # 이 소스의 클래스는 [melt pool, seam, torch, wire] — wire 만 사용.
      wire: wire
    val_ratio: 0.1               # stage1 선택 지표용 공개 val
    oversample: 1
    crop:
      enabled: false             # 공개셋은 이미 잘려 있음
    resize: null

# only: [rf_a]
