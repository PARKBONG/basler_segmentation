# Stage 2 (in-domain 적응) — train/val/test 전부 인도메인 kimm.
#   python preprocess.py --config preprocess.stage2.yaml
# test 는 최종 모델에 딱 한 번 (eval.final.yaml). 이 수치를 보고
# 하이퍼파라미터를 다시 만지면 그 순간 오염됩니다.
# 필드 설명은 preprocess.single.yaml 머리말 참고. 이 파일이 이 스테이지의
# 전처리 전부를 소유합니다 — 다른 yaml 을 참조하지 않습니다.

names:
  0: wire

seed: 0

preview:
  enabled: true
  count: 12

# 산출 라벨 형식. obb = seg 폴리곤을 회전 사각형(꼭지점 4개)으로 변환해 저장
# (이 프로젝트는 OBB 로 진행). seg = 폴리곤 그대로.
task: obb


out: ../datasets/processed/stage2   # train.stage2.yaml 의 train.data 와 1:1 짝

sources:
  - name: kimm
    path: ../datasets/raw/kimm
    class_map:
      wire: wire
    val_ratio: 0.2
    test_ratio: 0.1
    oversample: 1
    crop:                        # 상세 설명은 preprocess.single.yaml 의 kimm 블록 참고
      enabled: true
      width: 640
      height: 640
      center_x: 50
      center_y: 50
      auto_crop:
        enabled: false
        margin: 0.25
        min_size: 640
      min_area: 0.10
    resize: null

# only: [kimm]
