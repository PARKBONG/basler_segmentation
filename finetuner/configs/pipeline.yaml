# 데이터 파이프라인 공유 정의 — "소스가 무엇인지"를 여기 한 번만 적습니다.
#   download.py 가 자동으로 읽고(후보가 이 파일 하나), preprocess.*.yaml 이
#   pipeline: 키로 참조합니다. "무엇을 어디에 굽는지"는 preprocess.*.yaml 소유.
# 경로는 이 yaml(=finetuner/ 폴더) 기준 상대경로 또는 절대경로.
#
# API 키는 여기 적지 말고 환경변수 ROBOFLOW_API_KEY 로 넘기세요.

# 최종 통합 클래스 — index가 최종 class id. class_map의 목적지 이름은 반드시 여기 존재해야 함.
names:
  0: wire

seed: 0    # 분할 시드 — 소스별로 파생되므로 소스를 추가/제거해도 다른 소스의 분할이 안 바뀜

# 산출물에서 몇 장을 골라 라벨 폴리곤을 그려 out/_preview/ 에 저장합니다.
# 크롭이 라벨을 제대로 따라 잘랐는지 눈으로 확인하는 용도.
preview:
  enabled: true
  count: 12

sources:
  # ── 내 카메라 원본 (비공개, 인도메인 = 귀중) ─────────────────────────
  #   앱(BaslerLiveView)의 REC 가 크롭 전 풀사이즈 PNG 를 images/ 에 쌓습니다.
  #   라벨링 결과를 labels/ 에 넣고 data.yaml 을 두 줄짜리로 만들어 두세요:
  #       names: {0: wire}
  #       train: images
  - name: kimm
    path: ../datasets/raw/kimm   # 규약: 모든 원천 데이터는 datasets/raw/<이름>/ 아래에 둡니다.
    class_map:                   # 소스클래스명 → 최종클래스명 (여기 없는 소스 클래스는 제외)
      wire: wire
    oversample: 1                # train 강조 배수 (val/test 에는 적용 안 됨)
    crop:
      # 이미지와 폴리곤 라벨을 함께 자릅니다. 크롭 인자는 소스마다 독립입니다(공유 기본값 없음).
      enabled: true
      # 크롭 창 크기(픽셀). 0 이면 그 축은 원본 전체를 씁니다.
      # (width: 0, height: 640 → 좌우는 원본 그대로, 상하만 640 으로 자름)
      # 원본보다 큰 값을 적으면 원본 크기로 클램프됩니다.
      width: 640
      height: 640
      # 창 위치(%). 좌우 = center_x, 상하 = center_y. 앱 FrameCropper 와 같은 규약:
      #   0 = 왼쪽/위 끝, 50 = 중앙, 100 = 오른쪽/아래 끝.
      #   → 앱 툴바 슬라이더에서 찾은 값을 그대로 옮겨 적으면 됩니다.
      center_x: 50
      center_y: 50
      # 자동 크롭 — 창의 중심과 크기를 이미지마다 라벨(wire)에서 직접 잡습니다.
      # 켜면 위의 width/height/center_x/center_y 는 무시됩니다.
      #   크기 = 라벨 경계상자 × (1 + 2*margin), 단 min_size 아래로는 안 내려감
      #   중심 = 라벨 경계상자 중심 (창은 이미지 밖으로 나가지 않게 밀어 넣음)
      #   원본이 작아 창이 min_size 에 못 미치면 경고를 찍습니다.
      auto_crop:
        enabled: false
        margin: 0.25             # 라벨 주위 여유 (경계상자 크기 대비 비율)
        min_size: 640            # 창 한 변의 하한 = 경고 기준선
      # 크롭 후 남은 폴리곤 면적 / 원래 면적. 이 값 미만이면 그 인스턴스는 폐기합니다
      # (경계에 걸린 부스러기 라벨 제거). 살아남은 인스턴스가 0이면 이미지째 제외.
      min_area: 0.10
    # 크롭 후 리사이즈. null 이면 그대로. 라벨은 정규화 좌표라 영향 없음.
    # 학습은 어차피 imgsz 로 letterbox 하므로 보통 null 로 둬도 됩니다.
    resize: null

  # ── 공개 데이터셋 (보조) — roboflow: 블록이 있으면 download.py 가 내려받습니다 ──
  #   필요한 만큼 블록을 복제해서 rf_b, rf_c … 로 추가. 각자 다른 인자를 가집니다.
  - name: rf_a
    path: ../datasets/raw/rf_a   # 받은 파일이 풀리는 위치 = preprocess 가 읽는 위치.
                                 # Roboflow 의 train/valid/test 분할은 받은 직후 kimm 처럼
                                 # images/ + labels/ 하나로 합쳐집니다 (분할은 preprocess 담당).
    roboflow:
      # workspace/project 는 Universe URL 의 두 조각 그대로:
      #   universe.roboflow.com/<workspace>/<project>
      # https://app.roboflow.com/waam-syqaj/weld-distance-8tgl8
      # (dominik-brnjak-gcdtj/weld-distance 를 내 워크스페이스로 fork 한 것)
      workspace: waam-syqaj
      project: weld-distance-8tgl8
      version: latest            # 숫자로 고정하거나, latest = 가장 높은 버전 자동 선택
      # Roboflow 가 zip 을 어떤 레이아웃으로 내보낼지. 학습할 모델과는 무관합니다
      # (yolov8/yolov9/yolov11 seg export 는 결과가 사실상 동일 — data.yaml +
      #  정규화 폴리곤 txt). 학습 모델은 train_config*.yaml 의 train.model 이 정합니다.
      format: yolov11
    class_map:
      wire: wire                 # 예: 공개셋의 'cable' 을 최종 'wire' 로 통일
    oversample: 1
    crop:
      enabled: false             # 공개셋은 이미 잘려 있음. 켜려면 width/height/center_*
                                 # (또는 auto_crop) 를 이 블록에 직접 적으세요.
    resize: null
