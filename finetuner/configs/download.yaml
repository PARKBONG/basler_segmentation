# 공개 데이터셋 다운로드 설정 — download.py 전용 (후보가 이 파일 하나 → --config 생략 시 자동).
#
# "무엇을 어떻게 전처리하는지"는 preprocess.*.yaml 이 소유합니다 — 두 쪽이 공유하는 건
# 원천 데이터 폴더 규약(datasets/raw/<이름>/) 하나뿐이라, 여기의 path 와
# preprocess.*.yaml 의 path 가 같은 값을 가리키기만 하면 됩니다.
# (kimm 같은 로컬 소스는 다운로드 대상이 아니므로 이 파일에 없습니다.)
#
# 경로는 이 yaml(=finetuner/ 폴더) 기준 상대경로 또는 절대경로.
# API 키는 여기 적지 말고 환경변수 ROBOFLOW_API_KEY 로 넘기세요.

sources:
  # 필요한 만큼 블록을 복제해서 rf_b, rf_c … 로 추가.
  - name: rf_a
    path: ../datasets/raw/rf_a   # 받은 파일이 풀리는 위치 = preprocess 가 읽는 위치.
                                 # Roboflow 의 train/valid/test 분할은 받은 직후 kimm 처럼
                                 # images/ + labels/ 하나로 합쳐집니다 (분할은 preprocess 담당).
    roboflow:
      # workspace/project 는 Universe URL 의 두 조각 그대로:
      #   universe.roboflow.com/<workspace>/<project>
      # https://app.roboflow.com/waam-syqaj/weld-distance-8tgl8
      # (dominik-brnjak-gcdtj/weld-distance 를 내 워크스페이스로 fork 한 것)
      workspace: waam-syqaj
      project: weld-distance-8tgl8
      version: latest            # 숫자로 고정하거나, latest = 가장 높은 버전 자동 선택
      # Roboflow 가 zip 을 어떤 레이아웃으로 내보낼지. 학습할 모델과는 무관합니다
      # (yolov8/yolov9/yolov11 seg export 는 결과가 사실상 동일 — data.yaml +
      #  정규화 폴리곤 txt). 학습 모델은 train.*.yaml 의 train.model 이 정합니다.
      format: yolov11

  # https://app.roboflow.com/waam-syqaj/my-first-project-kmjet-n0ors
  - name: rf_b
    path: ../datasets/raw/rf_b
    roboflow:
      workspace: waam-syqaj
      project: my-first-project-kmjet-n0ors
      version: latest
      format: yolov11

  # https://app.roboflow.com/waam-syqaj/train-without-boxv1-wf3dn
  - name: rf_c
    path: ../datasets/raw/rf_c
    roboflow:
      workspace: waam-syqaj
      project: train-without-boxv1-wf3dn
      version: latest
      format: yolov11

  # https://app.roboflow.com/waam-syqaj/gtaw-tig-_front-view-zfqwh
  - name: rf_d
    path: ../datasets/raw/rf_d
    roboflow:
      workspace: waam-syqaj
      project: gtaw-tig-_front-view-zfqwh
      version: latest
      format: yolov11

  # https://app.roboflow.com/waam-syqaj/final-pcvxo-6po2v
  - name: rf_e
    path: ../datasets/raw/rf_e
    roboflow:
      workspace: waam-syqaj
      project: final-pcvxo-6po2v
      version: latest
      format: yolov11